name: Pages

# Builds the website (site/ plus a page per file in examples/) into _site/ and
# deploys it to GitHub Pages on every push to main, and again once Publish has
# put a release on npm: the footer names npm's latest version, not package.json's.
# npm's `latest` can lag the Publish run by minutes, so that run first waits until
# it names the release tag, and fails if it does not within 10 minutes.
# Pull requests only build it.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait until npm latest is the release tag
        id: npm
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          # Publish runs on a release, so its head_branch is the tag (v0.12.0).
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          want="${TAG#v}"
          if [[ ! "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Publish ran for '$TAG', which is not a version tag"
            exit 1
          fi
          # One deadline for the whole wait: a stalled request cannot stretch it past 10 minutes.
          deadline=$((SECONDS + 600))
          got=""
          while :; do
            left=$((deadline - SECONDS))
            wait=$(( left < 15 ? left : 15 )); (( wait > 0 )) || wait=1
            got="$(curl -fsS --max-time "$wait" -H 'Cache-Control: no-cache' https://registry.npmjs.org/austere-axi/latest | jq -r .version || true)"
            if [ "$got" = "$want" ]; then
              echo "npm latest is $got"
              # The site renders this version, not a second registry answer a cache may serve stale.
              echo "version=$got" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then break; fi
            echo "npm latest is ${got:-unknown}, waiting for $want (${left}s left)"
            sleep "$(( left < 15 ? left : 15 ))"
          done
          echo "::error::npm latest is still ${got:-unknown} after 10 minutes, not $want (tag $TAG); run Pages again by hand once npm shows it"
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm run site` checks every example, screenshots it, and fails on a render error.
      - shell: bash
        env:
          # Set only after Publish: the version the wait step saw on npm.
          AUSTERE_AXI_SITE_VERSION: ${{ steps.npm.outputs.version }}
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          npm run site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
