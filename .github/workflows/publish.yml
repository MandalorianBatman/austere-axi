name: Publish

# Publishing a GitHub Release publishes package.json's version to npmjs.org
# through trusted publishing (OIDC): no token secret, provenance attached.
# npmjs.com trusted publisher: MandalorianBatman / austere-axi / publish.yml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      # prepublishOnly builds dist/ and runs the tests.
      - run: npm publish
