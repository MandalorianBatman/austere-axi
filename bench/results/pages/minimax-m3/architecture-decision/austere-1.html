<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Review ADR-017</title>
  <script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([overview, contextCard, optionsCard, proposalCard, consequencesCard, decisionCard], "column", "xl")
overview = Card([CardHeader("ADR-017: Event bus for order events", "Architecture decision review"), overviewText])
overviewText = MarkDownRenderer("**Status:** Proposed\n\nThe proposed decision is **Amazon SQS + SNS** for order events. Reviewers should accept or reject the decision and may include an optional comment.")
contextCard = Card([CardHeader("Context", "Current synchronous order workflow"), contextText])
contextText = MarkDownRenderer("The Orders service calls Billing, Shipping and Notifications over HTTP in sequence. One slow call blocks checkout. Last quarter there were **3 incidents** from this.")
optionsCard = Card([CardHeader("Options", "Throughput, replay, operations, and team experience"), optionsTable])
optionsTable = Table([Col("Option", ["Kafka", "NATS JetStream", "Amazon SQS + SNS"]), Col("Throughput", ["1M msg/s", "200k msg/s", "Effectively unlimited"]), Col("Replay", ["Yes", "Yes", ["No", "14-day retention only"]]), Col("Operations cost", ["High", "Medium", "Low (managed)"]), Col("Additional operations", ["3-broker cluster", "Not stated", "Not stated"]), Col("Team experience", ["None", "One engineer", "High"])])
proposalCard = Card([CardHeader("Proposed decision", "Amazon SQS + SNS"), proposalText, proposalFlow])
proposalText = MarkDownRenderer("Orders publishes **\"order.placed\"** to an SNS topic. Billing, Shipping and Notifications each read from their own SQS queue.")
proposalFlow = Mermaid("flowchart LR\n  Orders[Orders service] -->|order.placed| SNS[SNS topic]\n  SNS --> BillingQ[Billing SQS queue]\n  SNS --> ShippingQ[Shipping SQS queue]\n  SNS --> NotificationsQ[Notifications SQS queue]\n  BillingQ --> Billing[Billing]\n  ShippingQ --> Shipping[Shipping]\n  NotificationsQ --> Notifications[Notifications]", "Proposed event flow")
consequencesCard = Card([CardHeader("Consequences", "Delivery guarantees and operational trade-offs"), consequencesText])
consequencesText = MarkDownRenderer("- **No event replay:** Keep an outbox table in the Orders database.\n- **At-least-once delivery:** Every consumer must be idempotent.")
decisionCard = Card([CardHeader("Review decision", "Accept or reject the proposed decision"), decisionForm])
decisionForm = Form("adrReview", decisionButtons, [decisionField, commentField])
decisionField = FormControl("Decision", RadioGroup("decision", [RadioItem("Accept", "Approve the proposed SQS + SNS decision", "accept"), RadioItem("Reject", "Do not approve the proposed decision", "reject")], null, {required: true}))
commentField = FormControl("Comment (optional)", TextArea("comment", "Add context or reasons for your decision", 4))
decisionButtons = Buttons([Button("Submit review", @ToAssistant("ADR-017 review decision submitted"), "primary")])
</script>
</body>
</html>
