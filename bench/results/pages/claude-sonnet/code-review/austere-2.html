<!doctype html>
<html><head><meta charset="utf-8"><title>PR #482 review: user search endpoint</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([summaryCard, verdictCallout, reviewRow], "column", "l")
summaryCard = Card([CardHeader("PR #482: Add user search endpoint", "src/routes/users.js"), summaryFacts])
summaryFacts = EntityList([{left: "File", right: "src/routes/users.js"}, {left: "Change", right: "+9 -1"}, {left: "Tests", right: "31 passed"}, {left: "Findings", right: "4 (1 high, 2 medium, 1 low)"}])
verdictCallout = Callout("error", "Verdict: request changes", "One high-severity finding (SQL injection) and two medium findings need to be addressed.")
reviewRow = Stack([diffCard, findingsColumn], "row", "m", "start", "start", true)
diffCard = Card([CardHeader("The diff", "Click a line to comment on it"), usersPatch])
usersPatch = Diff("diff --git a/src/routes/users.js b/src/routes/users.js
--- a/src/routes/users.js
+++ b/src/routes/users.js
@@ -12,7 +12,15 @@ router.get(\"/users/:id\", async (req, res) => {
   res.json(user);
 });
 
-router.get(\"/users\", listUsers);
+router.get(\"/users\", async (req, res) => {
+  const q = req.query.q;
+  const rows = await db.query(
+    \"SELECT id, name, email FROM users WHERE name LIKE '%\" + q + \"%'\"
+  );
+  res.json(rows);
+});
+
+router.get(\"/users/export\", exportUsers);
 
 module.exports = router;", "src/routes/users.js")
findingsColumn = Stack([sqlInjectionFinding, paginationFinding, emailExposureFinding, exportTestFinding], "column", "m")
sqlInjectionFinding = Card([CardHeader("1. SQL injection", "Line 18"), sqlInjectionSeverity, sqlInjectionText])
sqlInjectionSeverity = Stack([sqlInjectionTag])
sqlInjectionTag = Tag("High", null, "md", "danger")
sqlInjectionText = MarkDownRenderer("The query concatenates `req.query.q` into the SQL string (line 18).")
paginationFinding = Card([CardHeader("2. No pagination", "/users search handler"), paginationSeverity, paginationText])
paginationSeverity = Stack([paginationTag])
paginationTag = Tag("Medium", null, "md", "warning")
paginationText = MarkDownRenderer("The search returns every matching row. With 2.1M users this can time out.")
emailExposureFinding = Card([CardHeader("3. Email column exposed", "Line 18"), emailExposureSeverity, emailExposureText])
emailExposureSeverity = Stack([emailExposureTag])
emailExposureTag = Tag("Medium", null, "md", "warning")
emailExposureText = MarkDownRenderer("The `email` column is returned to any logged-in user (line 18). Return only `id` and `name`.")
exportTestFinding = Card([CardHeader("4. Missing test", "/users/export"), exportTestSeverity, exportTestText])
exportTestSeverity = Stack([exportTestTag])
exportTestTag = Tag("Low", null, "md", "info")
exportTestText = MarkDownRenderer("`/users/export` has no test.")
</script></body></html>
