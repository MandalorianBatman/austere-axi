<!doctype html>
<html><head><meta charset="utf-8"><title>Migration plan: sessions from Redis to Postgres</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, flow, phases, risks, cost, decide], "column", "l")
intro = Card([CardHeader("Move user sessions from Redis to Postgres", "Migration plan for review"), introText, goalCallout])
introText = MarkDownRenderer("Sessions live only in Redis and are lost on failover. Last month that forced **38,214 users** to log in again.")
goalCallout = Callout("info", "Goal", "Durable sessions, no forced logout, and auth p99 stays at or under 45 ms (today 41 ms).")
flow = Card([CardHeader("Request path after the change", "Redis stays as a read-through cache in front of Postgres"), flowDiagram])
flowDiagram = Architecture([client, api, pg, redis], [toApi, toPg, toRedis])
client = Node("Client", "external")
api = Node("API", "backend", "Node :8080")
pg = Node("Postgres", "database", "sessions table", "new")
redis = Node("Redis", "database", "read-through cache")
toApi = Edge(client, api, "HTTPS", "emphasis")
toPg = Edge(api, pg, "SQL")
toRedis = Edge(api, redis, "cache", "dashed")
phases = Card([CardHeader("Phases"), phaseSteps])
phaseSteps = Steps([phase1, phase2, phase3, phase4])
phase1 = StepsItem("1. Create sessions table and dual-write", "Duration: 1 week.")
phase2 = StepsItem("2. Backfill existing sessions", "Duration: 2 days.")
phase3 = StepsItem("3. Switch reads to Postgres", "Behind the sessions_pg flag. Duration: 1 week.")
phase4 = StepsItem("4. Remove Redis writes", "Duration: 1 day.")
risks = Card([CardHeader("Risks and mitigations"), riskTable])
riskTable = Table([Col("Risk", ["Write latency on login", "Table bloat from expired rows", "Connection pool exhaustion during the dual-write phase"]), Col("Mitigation", ["Async write with a 50 ms timeout", "Nightly partition drop", "PgBouncer in transaction mode in front of Postgres"])])
cost = Card([CardHeader("Extra cost"), costFacts])
costFacts = EntityList([{left: "Additional spend", right: "$140/month"}, {left: "Auth p99 target", right: "<= 45 ms (today 41 ms)"}])
decide = Card([CardHeader("Your call", "Approve the plan and pick a rollout strategy"), decisionNote, decideForm])
decisionNote = Callout("warning", "Decision needed", "Choose a rollout strategy: Big bang (one deploy, high risk) or Dual-write (gradual, low risk).")
decideForm = Form("rollout", decideButtons, [strategyField, notesField])
strategyField = FormControl("Rollout strategy", strategyCards)
strategyCards = OptionCards("strategy", "single", [bigBangOption, dualWriteOption], {required: true})
bigBangOption = OptionCard("bigbang", "Big bang", "One deploy, high risk", Icon("zap"))
dualWriteOption = OptionCard("dualwrite", "Dual-write", "Gradual, low risk", Icon("git-branch"))
notesField = FormControl("Notes", TextArea("notes", "Anything to change?", 3))
decideButtons = Buttons([approveButton])
approveButton = Button("Approve and send decision", @ToAssistant("Decision: approve plan and rollout strategy"), "primary")
</script></body></html>
