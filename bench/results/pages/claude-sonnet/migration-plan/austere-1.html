<!doctype html>
<html><head><meta charset="utf-8"><title>Sessions migration: Redis to Postgres</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, flow, phases, risks, cost, decide], "column", "l")
intro = Card([CardHeader("Move user sessions from Redis to Postgres", "Migration plan for review"), introText, goalCallout])
introText = MarkDownRenderer("Sessions live only in Redis and are lost on failover. Last month that forced **38,214 users** to log in again.")
goalCallout = Callout("info", "Goal", "Durable sessions, no forced logout, and auth p99 at or under 45 ms (today 41 ms).")
flow = Card([CardHeader("Request path after the change", "Redis stays as a read-through cache in front of Postgres"), flowDiagram])
flowDiagram = Architecture([client, api, redis, pg], [clientToApi, apiToRedis, redisToPg, apiToPg])
client = Node("Client", "external")
api = Node("API", "backend", "Node :8080")
redis = Node("Redis", "database", "read-through cache")
pg = Node("Postgres", "database", "sessions table", "new")
clientToApi = Edge(client, api, null, "emphasis")
apiToRedis = Edge(api, redis, "read-through", "dashed")
redisToPg = Edge(redis, pg, "on miss", "dashed")
apiToPg = Edge(api, pg, "session writes")
phases = Card([CardHeader("Phases"), phaseTable])
phaseTable = Table([Col("Phase", ["1", "2", "3", "4"]), Col("Work", ["Create the sessions table and dual-write", "Backfill existing sessions", "Switch reads to Postgres behind the sessions_pg flag", "Remove Redis writes"]), Col("Duration", ["1 week", "2 days", "1 week", "1 day"])])
risks = Card([CardHeader("Risks and mitigations"), riskTable])
riskTable = Table([Col("Risk", ["Write latency on login", "Table bloat from expired rows"]), Col("Mitigation", ["Async write with a 50 ms timeout", "Nightly partition drop"])])
cost = Card([CardHeader("Extra cost"), costFacts])
costFacts = EntityList([{left: "Additional monthly cost", right: "$140/month", rightVariant: "number"}])
decide = Card([CardHeader("Your call", "Approve the plan and pick a rollout strategy"), decideForm])
decideForm = Form("migrationDecision", decideButtons, [approvalField, strategyField])
approvalField = FormControl("Plan", RadioGroup("approval", [RadioItem("Approve", "Plan is good to go", "approve"), RadioItem("Request changes", "Plan needs changes first; add details in a message", "changes")], null, {required: true}))
strategyField = FormControl("Rollout strategy", RadioGroup("strategy", [RadioItem("Big bang", "One deploy, high risk", "bigbang"), RadioItem("Dual-write", "Gradual, low risk", "dualwrite")], null, {required: true}))
decideButtons = Buttons([Button("Send decision", @ToAssistant("Decision: sessions migration approval and rollout strategy"), "primary")])
</script></body></html>
