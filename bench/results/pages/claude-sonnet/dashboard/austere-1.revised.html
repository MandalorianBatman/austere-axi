<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout service health, week of 2026-10-26</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([overview, latencyAlert, trends, incidents, actions], "column", "l")
overview = Card([overviewHeader, kpis])
overviewHeader = CardHeader("Checkout service health", "Week of 2026-10-26, for the Monday review")
kpis = OverviewCardBlock([kpiRequests, kpiErrors, kpiLatency, kpiBudget], "grid")
kpiRequests = OverviewCardItem("requests", Text("text", "Requests"), MetricIndicatorInline("48.2M", "week over week", {direction: "up", value: 6}))
kpiErrors = OverviewCardItem("errors", Text("text", "Error rate"), MetricIndicatorInline("0.21%", "SLO 0.5%"))
kpiLatency = OverviewCardItem("latency", Text("text", "p95 latency"), MetricIndicatorInline("312 ms", "target 300 ms: breached"))
kpiBudget = OverviewCardItem("budget", Text("text", "Error budget left"), MetricIndicatorInline("64%", "this month"))
latencyAlert = Callout("warning", "p95 latency target breached", "Weekly p95 was 312 ms against a 300 ms target. INC-1051 (elevated p95 from a slow inventory query) is still under investigation.")
trends = Card([trendsHeader, latencyLabel, latencyChart, errorsLabel, errorsChart])
trendsHeader = CardHeader("Daily trends", "Monday to Sunday")
latencyLabel = InlineHeader("Daily p95 latency (ms)", "Target is 300 ms. Wed, Thu, Fri and Sun were above it.")
latencyChart = LineChart(["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], [latencySeries, latencyTargetSeries], "linear", "Day", "ms")
latencySeries = Series("p95 latency", [288, 295, 340, 331, 305, 297, 330])
latencyTargetSeries = Series("Target", [300, 300, 300, 300, 300, 300, 300])
errorsLabel = InlineHeader("Daily errors", "Highest on Wednesday at 15,900.")
errorsChart = BarChart(["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], [errorsSeries], "grouped", "Day", "Errors")
errorsSeries = Series("Errors", [9800, 10400, 15900, 12100, 9900, 8700, 9300])
incidents = Card([incidentsHeader, incidentTable])
incidentsHeader = CardHeader("Incidents", "Three this week, one still open")
incidentTable = Table([Col("ID", ["INC-1042", "INC-1047", "INC-1051"]), Col("Day", ["Tue", "Wed", "Sun"]), Col("Severity", [sev2Tag, sev2TagB, sev3TagB]), Col("Duration", ["38 min", "47 min", "ongoing"]), Col("Summary", ["Payment provider timeouts", "Bad config push to the cart cache", "Elevated p95 from a slow inventory query"]), Col("Status", [resolvedTagA, resolvedTagB, investigatingTag]), Col("Postmortem", ["—", "PM-1047", "—"])])
sev2Tag = Tag("Sev2", null, "sm", "danger")
sev3TagB = Tag("Sev3", null, "sm", "warning")
resolvedTagA = Tag("resolved", null, "sm", "success")
resolvedTagB = Tag("resolved", null, "sm", "success")
investigatingTag = Tag("investigating", null, "sm", "warning")
actions = Card([actionsHeader, actionTable])
actionsHeader = CardHeader("Action items", "Two open")
actionTable = Table([Col("Action", ["Add an index on inventory(sku, warehouse_id)", "Add a timeout alert for the payment provider"]), Col("Owner", ["Priya", "Marco"]), Col("Due", ["Nov 4", "Nov 6"])])
sev2TagB = Tag("Sev2", null, "sm", "danger")
</script></body></html>
