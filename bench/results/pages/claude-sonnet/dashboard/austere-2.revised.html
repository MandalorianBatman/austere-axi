<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout weekly service health: week of 2026-10-26</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, p95Callout, kpiCard, latencyCard, errorsCard, incidentsCard, actionsCard], "column", "l")
intro = Card([CardHeader("Checkout service health", "Week of 2026-10-26, Monday review"), introText])
introText = MarkDownRenderer("Traffic grew 6% week over week and error rate stayed inside its SLO. **p95 latency breached its target** at 312 ms, and INC-1051 is still under investigation.")
p95Callout = Callout("warning", "p95 latency target breached", "Weekly p95 was 312 ms against a 300 ms target. Daily p95 was above target on Wed, Thu, Fri and Sun. INC-1051 (slow inventory query) is ongoing.")
kpiCard = Card([CardHeader("Headline numbers"), kpiBlock])
kpiBlock = OverviewCardBlock([kpiRequests, kpiErrors, kpiLatency, kpiBudget], "grid")
kpiRequests = OverviewCardItem("requests", Text("text", "Requests"), MetricIndicatorInline("48.2M", "week over week", {direction: "up", value: 6}))
kpiErrors = OverviewCardItem("errorRate", Text("text", "Error rate"), MetricIndicatorInline("0.21%", "SLO 0.5%"))
kpiLatency = OverviewCardItem("p95", Text("text", "p95 latency"), MetricIndicatorInline("312 ms", "target 300 ms: breached"))
kpiBudget = OverviewCardItem("budget", Text("text", "Error budget left"), MetricIndicatorInline("64%", "this month"))
latencyCard = Card([CardHeader("Daily p95 latency", "Milliseconds, Mon to Sun, against the 300 ms target"), latencyChart])
latencyChart = LineChart(["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], [p95Series, targetSeries], "linear", "Day", "ms")
p95Series = Series("p95 (ms)", [288, 295, 340, 331, 305, 297, 330])
targetSeries = Series("Target (ms)", [300, 300, 300, 300, 300, 300, 300])
errorsCard = Card([CardHeader("Daily errors", "Count per day, Mon to Sun"), errorsChart])
errorsChart = BarChart(["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], [errorSeries], "grouped", "Day", "errors")
errorSeries = Series("Errors", [9800, 10400, 15900, 12100, 9900, 8700, 9300])
incidentsCard = Card([CardHeader("Incidents", "Three this week, one still open"), incidentsTable])
incidentsTable = Table([incIdCol, incDayCol, incSevCol, incDurCol, incSummaryCol, incStatusCol])
incIdCol = Col("ID", ["INC-1042", "INC-1047 (PM-1047)", "INC-1051"])
incDayCol = Col("Day", ["Tue", "Wed", "Sun"])
incSevCol = Col("Severity", ["Sev2", "Sev2", "Sev3"])
incDurCol = Col("Duration", ["38 min", "47 min", "ongoing"])
incSummaryCol = Col("Summary", ["Payment provider timeouts", "Bad config push to the cart cache", "Elevated p95 from a slow inventory query"])
incStatusCol = Col("Status", [statusResolvedA, statusResolvedB, statusInvestigating])
statusResolvedA = Tag("resolved", null, "sm", "success")
statusResolvedB = Tag("resolved", null, "sm", "success")
statusInvestigating = Tag("investigating", null, "sm", "warning")
actionsCard = Card([CardHeader("Action items", "Two follow-ups with owners"), actionsTable])
actionsTable = Table([actionCol, ownerCol, dueCol])
actionCol = Col("Action", ["Add an index on inventory(sku, warehouse_id)", "Add a timeout alert for the payment provider"])
ownerCol = Col("Owner", ["Priya", "Marco"])
dueCol = Col("Due", ["Nov 4", "Nov 6"])
</script></body></html>
