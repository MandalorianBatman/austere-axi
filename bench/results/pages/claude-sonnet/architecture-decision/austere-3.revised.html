<!doctype html>
<html><head><meta charset="utf-8"><title>ADR-017: Event bus for order events</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, contextCard, optionsCard, decisionCard, consequencesCard, decideCard], "column", "l")
intro = Card([CardHeader("ADR-017: Event bus for order events", "Status: proposed"), introTags])
introTags = Stack([statusTag, proposedTag], "row", "s")
statusTag = Tag("proposed", null, "md", "info")
proposedTag = Tag("Proposed: SQS + SNS", null, "md", "neutral")
contextCard = Card([CardHeader("Context"), contextText, contextCallout])
contextText = MarkDownRenderer("The Orders service calls Billing, Shipping and Notifications over HTTP in sequence. One slow call blocks checkout.")
contextCallout = Callout("warning", "Incidents", "Last quarter there were 3 incidents from this.")
optionsCard = Card([CardHeader("Options considered"), optionsTable])
optionsTable = Table([Col("Option", ["Kafka", "NATS JetStream", "Amazon SQS + SNS"]), Col("Throughput", ["1M msg/s", "200k msg/s", "Effectively unlimited"]), Col("Replay", ["Yes", "Yes", replayNo]), Col("Ops cost", [opsHigh, opsMedium, opsLow]), Col("Monthly cost estimate", ["About $2,400", "About $900", "About $310"]), Col("Team experience", ["None", "One engineer", "High"])])
replayNo = Tag("No (14-day retention only)", null, "sm", "warning")
opsHigh = Tag("High (3-broker cluster)", null, "sm", "danger")
opsMedium = Tag("Medium", null, "sm", "warning")
opsLow = Tag("Low (managed)", null, "sm", "success")
decisionCard = Card([CardHeader("Proposed decision", "SQS + SNS"), decisionText, decisionDiagram])
decisionText = MarkDownRenderer("Orders publishes `order.placed` to an SNS topic. Billing, Shipping and Notifications each read from their own SQS queue.")
decisionDiagram = Architecture([ordersNode, topicNode, billingQueue, shippingQueue, notificationsQueue], [toTopic, toBilling, toShipping, toNotifications])
ordersNode = Node("Orders", "backend", "publishes order.placed")
topicNode = Node("SNS topic", "messagebus", "order.placed")
billingQueue = Node("Billing queue", "messagebus", "SQS")
shippingQueue = Node("Shipping queue", "messagebus", "SQS")
notificationsQueue = Node("Notifications queue", "messagebus", "SQS")
toTopic = Edge(ordersNode, topicNode, "publish", "emphasis")
toBilling = Edge(topicNode, billingQueue, "Billing")
toShipping = Edge(topicNode, shippingQueue, "Shipping")
toNotifications = Edge(topicNode, notificationsQueue, "Notifications")
consequencesCard = Card([CardHeader("Consequences"), replayCallout, deliveryCallout])
replayCallout = Callout("warning", "No event replay", "We keep an outbox table in the Orders database.")
deliveryCallout = Callout("warning", "At-least-once delivery", "Every consumer must be idempotent.")
decideCard = Card([CardHeader("Your decision", "Accept or reject ADR-017"), decideForm])
decideForm = Form("adr017", decideButtons, [verdictField, commentField])
verdictField = FormControl("Verdict", RadioGroup("verdict", [RadioItem("Accept", "Adopt SQS + SNS as proposed", "accept"), RadioItem("Reject", "Do not adopt this decision", "reject")], null, {required: true}))
commentField = FormControl("Comment", TextArea("comment", "Optional comment", 3))
decideButtons = Buttons([Button("Send decision", @ToAssistant("Decision: ADR-017"), "primary")])
</script></body></html>
