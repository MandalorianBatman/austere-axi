<!doctype html>
<html><head><meta charset="utf-8"><title>ADR-017: Event bus for order events</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([summary, contextSection, optionsSection, decisionSection, consequencesSection, decideSection], "column", "l")
summary = Card([CardHeader("ADR-017: Event bus for order events", "Review: accept or reject the proposed decision"), summaryFacts])
summaryFacts = EntityList([{left: "Status", right: "Proposed"}, {left: "Proposed decision", right: "Amazon SQS + SNS"}, {left: "Options considered", right: "3", rightVariant: "number"}])
contextSection = Card([CardHeader("Context", "Why this decision is needed"), contextText])
contextText = MarkDownRenderer("The Orders service calls Billing, Shipping and Notifications over HTTP **in sequence**. One slow call blocks checkout.\n\nLast quarter this caused **3 incidents**.")
optionsSection = Card([CardHeader("Options", "Three event buses compared"), optionsTable])
optionsTable = Table([Col("Option", ["Kafka", "NATS JetStream", "Amazon SQS + SNS"]), Col("Throughput", ["1M msg/s", "200k msg/s", "Effectively unlimited"]), Col("Replay", ["Yes", "Yes", "No (14-day retention only)"]), Col("Ops cost", ["High (3-broker cluster to run)", "Medium", "Low (managed)"]), Col("Team experience", ["None", "One engineer", "High"])])
decisionSection = Card([CardHeader("Proposed decision", "Amazon SQS + SNS"), decisionText, decisionDiagram])
decisionText = MarkDownRenderer("Orders publishes `order.placed` to an SNS topic. Billing, Shipping and Notifications each read from their own SQS queue.")
decisionDiagram = Architecture([ordersSvc, ordersDb, orderTopic, billingQueue, shippingQueue, notifQueue, billingSvc, shippingSvc, notifSvc], [outboxEdge, publishEdge, toBillingQ, toShippingQ, toNotifQ, billingRead, shippingRead, notifRead])
ordersSvc = Node("Orders", "backend")
ordersDb = Node("Orders database", "database", "outbox table")
orderTopic = Node("SNS topic", "messagebus", "order.placed", "new")
billingQueue = Node("Billing queue", "messagebus", "SQS")
shippingQueue = Node("Shipping queue", "messagebus", "SQS")
notifQueue = Node("Notifications queue", "messagebus", "SQS")
billingSvc = Node("Billing", "backend")
shippingSvc = Node("Shipping", "backend")
notifSvc = Node("Notifications", "backend")
outboxEdge = Edge(ordersSvc, ordersDb, "outbox", "dashed")
publishEdge = Edge(ordersSvc, orderTopic, "publish", "emphasis")
toBillingQ = Edge(orderTopic, billingQueue)
toShippingQ = Edge(orderTopic, shippingQueue)
toNotifQ = Edge(orderTopic, notifQueue)
billingRead = Edge(billingQueue, billingSvc)
shippingRead = Edge(shippingQueue, shippingSvc)
notifRead = Edge(notifQueue, notifSvc)
consequencesSection = Card([CardHeader("Consequences", "What we accept by choosing SQS + SNS"), replayCallout, deliveryCallout])
replayCallout = Callout("warning", "No event replay", "SQS keeps messages for 14 days only, so we keep an outbox table in the Orders database.")
deliveryCallout = Callout("warning", "At-least-once delivery", "Every consumer must be idempotent.")
decideSection = Card([CardHeader("Your decision", "Accept or reject ADR-017"), decideForm])
decideForm = Form("adr017Decision", decideButtons, [commentField])
commentField = FormControl("Comment (optional)", TextArea("comment", "Reasons, conditions or requested changes", 4))
decideButtons = Buttons([acceptButton, rejectButton])
acceptButton = Button("Accept", @ToAssistant("Decision: accept ADR-017"), "primary")
rejectButton = Button("Reject", @ToAssistant("Decision: reject ADR-017"), "secondary", "destructive")
</script></body></html>
