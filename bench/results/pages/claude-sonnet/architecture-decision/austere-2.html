<!doctype html>
<html><head><meta charset="utf-8"><title>ADR-017: Event bus for order events</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, contextCard, optionsCard, decisionCard, consequencesCard, decideCard], "column", "l")
intro = Card([CardHeader("ADR-017: Event bus for order events", "Architecture decision record, for review"), introFacts])
introFacts = EntityList([{left: "Status", right: "Proposed"}, {left: "Proposed decision", right: "Amazon SQS + SNS"}, {left: "Reviewer action", right: "Accept or Reject"}])
contextCard = Card([CardHeader("Context"), contextText, incidentCallout])
contextText = MarkDownRenderer("The Orders service calls Billing, Shipping and Notifications over HTTP **in sequence**. One slow call blocks checkout.")
incidentCallout = Callout("warning", "3 incidents last quarter", "Slow downstream calls blocking checkout caused 3 incidents last quarter.")
optionsCard = Card([CardHeader("Options considered"), optionsTable])
optionsTable = Table([Col("Option", ["Kafka", "NATS JetStream", "Amazon SQS + SNS"]), Col("Throughput", ["1M msg/s", "200k msg/s", "Effectively unlimited"]), Col("Replay", [replayYesKafka, replayYesNats, replayNoSqs]), Col("Ops cost", ["High (3-broker cluster to run)", "Medium", "Low (managed)"]), Col("Team experience", ["None", "One engineer", "High"])])
replayYesKafka = Tag("yes", null, "sm", "success")
replayYesNats = Tag("yes", null, "sm", "success")
replayNoSqs = Tag("no (14-day retention only)", null, "sm", "danger")
decisionCard = Card([CardHeader("Proposed decision", "SQS + SNS"), decisionText, flowDiagram])
decisionText = MarkDownRenderer("Orders publishes `order.placed` to an SNS topic. Billing, Shipping and Notifications each read from their own SQS queue.")
flowDiagram = Architecture([ordersSvc, ordersDb, orderTopic, billingQueue, shippingQueue, notificationsQueue, billingSvc, shippingSvc, notificationsSvc], [ordersToDb, ordersToTopic, topicToBillingQ, topicToShippingQ, topicToNotificationsQ, billingQToSvc, shippingQToSvc, notificationsQToSvc])
ordersSvc = Node("Orders", "backend", "publishes order.placed")
ordersDb = Node("Orders DB", "database", "outbox table", "new")
orderTopic = Node("SNS topic", "messagebus", "order.placed")
billingQueue = Node("Billing queue", "messagebus", "SQS")
shippingQueue = Node("Shipping queue", "messagebus", "SQS")
notificationsQueue = Node("Notifications queue", "messagebus", "SQS")
billingSvc = Node("Billing", "backend")
shippingSvc = Node("Shipping", "backend")
notificationsSvc = Node("Notifications", "backend")
ordersToDb = Edge(ordersSvc, ordersDb, "outbox", "dashed")
ordersToTopic = Edge(ordersSvc, orderTopic, "publish", "emphasis")
topicToBillingQ = Edge(orderTopic, billingQueue)
topicToShippingQ = Edge(orderTopic, shippingQueue)
topicToNotificationsQ = Edge(orderTopic, notificationsQueue)
billingQToSvc = Edge(billingQueue, billingSvc)
shippingQToSvc = Edge(shippingQueue, shippingSvc)
notificationsQToSvc = Edge(notificationsQueue, notificationsSvc)
consequencesCard = Card([CardHeader("Consequences"), replayCallout, idempotencyCallout])
replayCallout = Callout("warning", "No event replay", "SQS retains messages for 14 days only, so we keep an outbox table in the Orders database.")
idempotencyCallout = Callout("warning", "At-least-once delivery", "Every consumer must be idempotent.")
decideCard = Card([CardHeader("Your decision", "ADR-017 is currently proposed"), decideForm])
decideForm = Form("adr017Decision", decideButtons, [commentField])
commentField = FormControl("Comment (optional)", TextArea("comment", "Reason or conditions for your decision", 3))
decideButtons = Buttons([Button("Accept", @ToAssistant("Decision: Accept ADR-017"), "primary"), Button("Reject", @ToAssistant("Decision: Reject ADR-017"), "secondary", "destructive")])
</script></body></html>
