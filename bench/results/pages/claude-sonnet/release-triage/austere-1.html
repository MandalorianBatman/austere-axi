<!doctype html>
<html><head><meta charset="utf-8"><title>Release 3.8 bug triage</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, timingCallout, bugsCard, decideCard], "column", "l")
intro = Card([CardHeader("Release 3.8 bug triage", "4 open bugs, one decision each"), introText])
introText = MarkDownRenderer("Release 3.8 ships **Thursday**. Code freeze is **Wednesday 18:00**.\n\nPick one outcome per bug below and send all four decisions back together. The form is pre-filled with the suggested split: fix BUG-311 and BUG-318, defer BUG-322 and BUG-327.")
timingCallout = Callout("warning", "Fix estimate unknown for BUG-327", "BUG-327 has no fix estimate, and BUG-322 needs 2 days. Code freeze is Wednesday 18:00.")
bugsCard = Card([CardHeader("Open bugs", "Facts as reported"), bugsTable])
bugsTable = Table([bugCol, titleCol, sevCol, usersCol, estCol])
bugCol = Col("Bug", ["BUG-311", "BUG-318", "BUG-322", "BUG-327"])
titleCol = Col("Title", ["Checkout button disabled after coupon removal", "Dark mode: unreadable table headers in Reports", "CSV export drops rows over 10,000", "Push notification sent twice on Android 15"])
sevCol = Col("Severity", [sevHigh, sevLow, sevMedium1, sevMedium2])
usersCol = Col("Users affected", ["~4% of carts", "Reports users", "120 accounts", "~9% of Android"])
estCol = Col("Fix estimate", ["0.5 day", "1 hour", "2 days", "unknown"])
sevHigh = Tag("high", null, "sm", "danger")
sevLow = Tag("low", null, "sm", "neutral")
sevMedium1 = Tag("medium", null, "sm", "warning")
sevMedium2 = Tag("medium", null, "sm", "warning")
decideCard = Card([CardHeader("Your decisions", "Fix for 3.8, defer to 3.9, or won't fix"), decideForm])
decideForm = Form("triage", decideButtons, [bug311Field, bug318Field, bug322Field, bug327Field])
bug311Field = FormControl("BUG-311: Checkout button disabled after coupon removal", bug311Group, "high severity, ~4% of carts, 0.5 day")
bug311Group = RadioGroup("bug311", [RadioItem("fix for 3.8", "Include in release 3.8", "fix"), RadioItem("defer to 3.9", "Move to release 3.9", "defer"), RadioItem("won't fix", "Close without fixing", "wontfix")], "fix")
bug318Field = FormControl("BUG-318: Dark mode: unreadable table headers in Reports", bug318Group, "low severity, Reports users, 1 hour")
bug318Group = RadioGroup("bug318", [RadioItem("fix for 3.8", "Include in release 3.8", "fix"), RadioItem("defer to 3.9", "Move to release 3.9", "defer"), RadioItem("won't fix", "Close without fixing", "wontfix")], "fix")
bug322Field = FormControl("BUG-322: CSV export drops rows over 10,000", bug322Group, "medium severity, 120 accounts, 2 days")
bug322Group = RadioGroup("bug322", [RadioItem("fix for 3.8", "Include in release 3.8", "fix"), RadioItem("defer to 3.9", "Move to release 3.9", "defer"), RadioItem("won't fix", "Close without fixing", "wontfix")], "defer")
bug327Field = FormControl("BUG-327: Push notification sent twice on Android 15", bug327Group, "medium severity, ~9% of Android, estimate unknown")
bug327Group = RadioGroup("bug327", [RadioItem("fix for 3.8", "Include in release 3.8", "fix"), RadioItem("defer to 3.9", "Move to release 3.9", "defer"), RadioItem("won't fix", "Close without fixing", "wontfix")], "defer")
decideButtons = Buttons([Button("Send all decisions", @ToAssistant("Decisions: release 3.8 bug triage"), "primary")])
</script></body></html>
