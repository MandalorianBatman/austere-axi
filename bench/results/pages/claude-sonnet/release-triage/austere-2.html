<!doctype html>
<html><head><meta charset="utf-8"><title>Release 3.8 bug triage</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, deadlineCallout, bugsCard, suggestionCard, decideCard], "column", "l")
intro = Card([CardHeader("Release 3.8 bug triage", "4 open bugs need a decision"), introText])
introText = MarkDownRenderer("Release 3.8 ships **Thursday**. Pick one decision per bug below, then send them all back at once.")
deadlineCallout = Callout("warning", "Code freeze: Wednesday 18:00", "Any bug marked fix for 3.8 has to land before the freeze.")
bugsCard = Card([CardHeader("Open bugs"), bugsTable])
bugsTable = Table([bugCol, titleCol, severityCol, usersCol, estimateCol])
bugCol = Col("Bug", ["BUG-311", "BUG-318", "BUG-322", "BUG-327"])
titleCol = Col("Title", ["Checkout button disabled after coupon removal", "Dark mode: unreadable table headers in Reports", "CSV export drops rows over 10,000", "Push notification sent twice on Android 15"])
severityCol = Col("Severity", [sevHigh, sevLow, sevMedium1, sevMedium2])
usersCol = Col("Users affected", ["~4% of carts", "Reports users", "120 accounts", "~9% of Android"])
estimateCol = Col("Fix estimate", ["0.5 day", "1 hour", "2 days", "unknown"])
sevHigh = Tag("high", null, "sm", "danger")
sevLow = Tag("low", null, "sm", "neutral")
sevMedium1 = Tag("medium", null, "sm", "warning")
sevMedium2 = Tag("medium", null, "sm", "warning")
suggestionCard = Card([CardHeader("Suggested plan"), suggestionText])
suggestionText = MarkDownRenderer("- **Fix for 3.8:** BUG-311, BUG-318\n- **Defer to 3.9:** BUG-322, BUG-327\n\nThe form below is pre-filled with this suggestion. Change any choice you disagree with.")
decideCard = Card([CardHeader("Your decisions", "One per bug"), decideForm])
decideForm = Form("triage", decideButtons, [bug311Field, bug318Field, bug322Field, bug327Field])
bug311Field = FormControl("BUG-311: Checkout button disabled after coupon removal", bug311Choice, "High severity, ~4% of carts, 0.5 day")
bug318Field = FormControl("BUG-318: Dark mode: unreadable table headers in Reports", bug318Choice, "Low severity, Reports users, 1 hour")
bug322Field = FormControl("BUG-322: CSV export drops rows over 10,000", bug322Choice, "Medium severity, 120 accounts, 2 days")
bug327Field = FormControl("BUG-327: Push notification sent twice on Android 15", bug327Choice, "Medium severity, ~9% of Android, fix estimate unknown")
bug311Choice = RadioGroup("bug311", [bug311Fix, bug311Defer, bug311Wont], "fix", {required: true})
bug318Choice = RadioGroup("bug318", [bug318Fix, bug318Defer, bug318Wont], "fix", {required: true})
bug322Choice = RadioGroup("bug322", [bug322Fix, bug322Defer, bug322Wont], "defer", {required: true})
bug327Choice = RadioGroup("bug327", [bug327Fix, bug327Defer, bug327Wont], "defer", {required: true})
bug311Fix = RadioItem("Fix for 3.8", "Land before code freeze, Wednesday 18:00", "fix")
bug311Defer = RadioItem("Defer to 3.9", "Move to the next release", "defer")
bug311Wont = RadioItem("Won't fix", "Close without a fix", "wontfix")
bug318Fix = RadioItem("Fix for 3.8", "Land before code freeze, Wednesday 18:00", "fix")
bug318Defer = RadioItem("Defer to 3.9", "Move to the next release", "defer")
bug318Wont = RadioItem("Won't fix", "Close without a fix", "wontfix")
bug322Fix = RadioItem("Fix for 3.8", "Land before code freeze, Wednesday 18:00", "fix")
bug322Defer = RadioItem("Defer to 3.9", "Move to the next release", "defer")
bug322Wont = RadioItem("Won't fix", "Close without a fix", "wontfix")
bug327Fix = RadioItem("Fix for 3.8", "Land before code freeze, Wednesday 18:00", "fix")
bug327Defer = RadioItem("Defer to 3.9", "Move to the next release", "defer")
bug327Wont = RadioItem("Won't fix", "Close without a fix", "wontfix")
decideButtons = Buttons([Button("Send all decisions", @ToAssistant("Triage decisions for release 3.8"), "primary")])
</script></body></html>
