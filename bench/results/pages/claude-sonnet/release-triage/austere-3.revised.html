<!doctype html>
<html><head><meta charset="utf-8"><title>Release 3.8 bug triage</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script></head>
<body><script type="text/openui">
root = Stack([intro, deadlineCallout, bugOverview, decisions], "column", "l")
intro = Card([CardHeader("Release 3.8 bug triage", "5 open bugs to decide before code freeze"), introText])
introText = MarkDownRenderer("Release 3.8 ships **Thursday**. Code freeze is **Wednesday 18:00**.\n\nFor each bug, choose **fix for 3.8**, **defer to 3.9** or **won't fix**, then send all five decisions back at once. The form is pre-filled with my suggestion: fix BUG-311, BUG-318 and BUG-330, defer BUG-322 and BUG-327.")
deadlineCallout = Callout("warning", "Freeze is Wednesday 18:00", "BUG-327 has an unknown fix estimate, so it is hard to commit to for 3.8. BUG-322 needs 2 days.")
bugOverview = Card([CardHeader("Open bugs", "Facts and my suggestion"), bugTable])
bugTable = Table([bugIdCol, bugTitleCol, bugSeverityCol, bugUsersCol, bugEstimateCol, bugSuggestionCol])
bugIdCol = Col("Bug", ["BUG-311", "BUG-318", "BUG-322", "BUG-327", "BUG-330"])
bugTitleCol = Col("Title", ["Checkout button disabled after coupon removal", "Dark mode: unreadable table headers in Reports", "CSV export drops rows over 10,000", "Push notification sent twice on Android 15", "Password reset email links expire after 5 minutes instead of 60"])
bugSeverityCol = Col("Severity", [sevHigh, sevLow, sevMedium1, sevMedium2, sevHigh330])
bugUsersCol = Col("Users affected", ["~4% of carts", "Reports users", "120 accounts", "~9% of Android", "All users who reset a password"])
bugEstimateCol = Col("Fix estimate", ["0.5 day", "1 hour", "2 days", "unknown", "1 hour"])
bugSuggestionCol = Col("My suggestion", ["Fix for 3.8", "Fix for 3.8", "Defer to 3.9", "Defer to 3.9", "Fix for 3.8"])
sevHigh = Tag("high", null, "sm", "danger")
sevLow = Tag("low", null, "sm", "neutral")
sevMedium1 = Tag("medium", null, "sm", "warning")
sevMedium2 = Tag("medium", null, "sm", "warning")
decisions = Card([CardHeader("Your decisions", "One per bug; all are sent together"), triageForm])
triageForm = Form("triage", triageButtons, [bug311Field, bug318Field, bug322Field, bug327Field, bug330Field])
bug311Field = FormControl("BUG-311: Checkout button disabled after coupon removal", bug311Choice, "high severity, ~4% of carts, 0.5 day")
bug318Field = FormControl("BUG-318: Dark mode: unreadable table headers in Reports", bug318Choice, "low severity, Reports users, 1 hour")
bug322Field = FormControl("BUG-322: CSV export drops rows over 10,000", bug322Choice, "medium severity, 120 accounts, 2 days")
bug327Field = FormControl("BUG-327: Push notification sent twice on Android 15", bug327Choice, "medium severity, ~9% of Android, fix estimate unknown")
bug311Choice = RadioGroup("BUG-311", [fixItem311, deferItem311, wontItem311], "fix-3.8")
bug318Choice = RadioGroup("BUG-318", [fixItem318, deferItem318, wontItem318], "fix-3.8")
bug322Choice = RadioGroup("BUG-322", [fixItem322, deferItem322, wontItem322], "defer-3.9")
bug327Choice = RadioGroup("BUG-327", [fixItem327, deferItem327, wontItem327], "defer-3.9")
fixItem311 = RadioItem("Fix for 3.8", "Include in Thursday's release", "fix-3.8")
deferItem311 = RadioItem("Defer to 3.9", "Move to the next release", "defer-3.9")
wontItem311 = RadioItem("Won't fix", "Close without fixing", "wont-fix")
fixItem318 = RadioItem("Fix for 3.8", "Include in Thursday's release", "fix-3.8")
deferItem318 = RadioItem("Defer to 3.9", "Move to the next release", "defer-3.9")
wontItem318 = RadioItem("Won't fix", "Close without fixing", "wont-fix")
fixItem322 = RadioItem("Fix for 3.8", "Include in Thursday's release", "fix-3.8")
deferItem322 = RadioItem("Defer to 3.9", "Move to the next release", "defer-3.9")
wontItem322 = RadioItem("Won't fix", "Close without fixing", "wont-fix")
fixItem327 = RadioItem("Fix for 3.8", "Include in Thursday's release", "fix-3.8")
deferItem327 = RadioItem("Defer to 3.9", "Move to the next release", "defer-3.9")
wontItem327 = RadioItem("Won't fix", "Close without fixing", "wont-fix")
triageButtons = Buttons([Button("Send all decisions", @ToAssistant("Triage decisions: release 3.8"), "primary")])
sevHigh330 = Tag("high", null, "sm", "danger")
bug330Field = FormControl("BUG-330: Password reset email links expire after 5 minutes instead of 60", bug330Choice, "high severity, all users who reset a password, 1 hour")
bug330Choice = RadioGroup("BUG-330", [fixItem330, deferItem330, wontItem330], "fix-3.8")
fixItem330 = RadioItem("Fix for 3.8", "Include in Thursday's release", "fix-3.8")
deferItem330 = RadioItem("Defer to 3.9", "Move to the next release", "defer-3.9")
wontItem330 = RadioItem("Won't fix", "Close without fixing", "wont-fix")
</script></body></html>
