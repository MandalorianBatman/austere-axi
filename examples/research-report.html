<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Benchmark report: 36 paired runs of austere-axi against lavish-axi on six review pages. Output tokens, time and cost, and where austere-axi lost.">
<title>Benchmark report: austere-axi vs lavish-axi</title>
<script src="../dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([title, finding, kpiCard, flowCard, taskCard, tableCard, caveat], "column", "l")
title = MarkDownRenderer("# Benchmark: austere-axi vs lavish-axi\n\nResearch report · 36 paired runs, 6 review pages, 2 models · run 2026-11-06 · austere-axi 0.4.1")
finding = Callout("info", "Same page, 3.2x fewer output tokens", "Each model wrote the same six review pages with each tool. Across all pairs, the lavish-axi page took a median 3.2x the output tokens, 2.4x the time and 2.5x the cost.")
kpiCard = Card([CardHeader("Median lavish-axi ÷ austere-axi, all 36 pairs"), kpiBlock])
kpiBlock = OverviewCardBlock([kpiTokens, kpiTime, kpiCost])
kpiTokens = OverviewCardItem("tokens", Text("text", "Output tokens"), MetricIndicatorInline("3.2x", "page, fix turn included"))
kpiTime = OverviewCardItem("time", Text("text", "Time"), MetricIndicatorInline("2.4x", "wall clock per page"))
kpiCost = OverviewCardItem("cost", Text("text", "Cost"), MetricIndicatorInline("2.5x", "per page"))
flowCard = Card([CardHeader("What happened to the 36 austere-axi pages", "Validator result on the first answer, then on the fix turn"), pageSankey])
pageSankey = Sankey(["Pages", "Pages", "Needed a fix turn", "Needed a fix turn"], ["Valid first try", "Needed a fix turn", "Fixed", "Still invalid"], [25, 11, 9, 2], "pages", "Needed a fix turn")
taskCard = Card([CardHeader("Output tokens, lavish-axi ÷ austere-axi, by task", "Above 1 means lavish-axi used more. Median output tokens per page, fix turn included."), taskBar])
taskBar = BarChart(["Migration plan", "Code review", "Architecture", "Comparison", "Dashboard", "Triage"], [Series("claude-sonnet", [4.0, 1.8, 2.5, 2.5, 2.1, 2.3]), Series("minimax-m3", [4.9, 2.7, 5.9, 4.9, 3.6, 5.1])], "grouped", "Task", "Ratio")
tableCard = Card([CardHeader("Medians per page"), pageTable])
pageTable = Table([Col("Model and tool", ["sonnet, austere-axi", "sonnet, lavish-axi", "minimax-m3, austere-axi", "minimax-m3, lavish-axi"]), Col("Tokens", ["2,391", "5,687", "1,108", "4,890"], "number"), Col("Time", ["16.9 s", "35.0 s", "8.2 s", "23.9 s"], "number"), Col("Cost", ["$0.025", "$0.059", "$0.0023", "$0.0067"], "number")])
caveat = Callout("warning", "Where austere-axi lost", "minimax-m3 passed austere-axi's validator on the first try in 7 of 18 pages (39%), against 16 of 18 (89%) for lavish-axi. 9 of its 11 fix turns worked. claude-sonnet passed 18 of 18.")
</script>
</body>
</html>
