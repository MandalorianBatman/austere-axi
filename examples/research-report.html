<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Research report evaluating reasoning models and quantization strategies: accuracy-latency quadrant, token flow sankey, and benchmark analysis.">
<title>Research report: reasoning model evaluation</title>
<script src="../dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([headerCard, kpiCard, quadrantCard, flowCard, benchmarkCard, reviewCard], "column", "l")
headerCard = Card([CardHeader("Research report: reasoning model benchmark", "Evaluation of frontier reasoning architectures · AI Research Lab"), summaryText, findingCallout])
summaryText = MarkDownRenderer("We evaluated five frontier reasoning models across 1,200 complex multi-step coding, architectural synthesis, and mathematical proof tasks. We measured accuracy, token efficiency, time-to-first-token (TTFT), and compute spend per benchmark solve.")
findingCallout = Callout("success", "Key Research Finding", "Chain-of-thought scaling yields diminishing accuracy returns beyond 4,000 reasoning tokens unless paired with dynamic tree-search pruning.")
kpiCard = Card([CardHeader("Aggregate benchmark metrics"), kpiBlock])
kpiBlock = OverviewCardBlock([kpiAccuracy, kpiThroughput, kpiCost])
kpiAccuracy = OverviewCardItem("accuracy", Text("text", "Top-1 Accuracy"), MetricIndicatorInline("88.4%", "+6.2% vs baseline", {direction: "up", value: 6}))
kpiThroughput = OverviewCardItem("throughput", Text("text", "Median Throughput"), MetricIndicatorInline("142 tok/s", "p50 on 8xH100"))
kpiCost = OverviewCardItem("cost", Text("text", "Cost per 1k solves"), MetricIndicatorInline("$4.80", "-24% with FP8", {direction: "down", value: 24}))
quadrantCard = Card([CardHeader("Quality vs latency trade-off space", "Top-right represents ideal frontier performance"), modelQuadrant])
modelQuadrant = Quadrant([mFrontier, mFast, mReasoning, mOpen, mDistilled], "Latency & Cost (p95)", "Benchmark Accuracy (0-100)")
mFrontier = QuadrantItem("Frontier-Thought-v3", 75, 92)
mFast = QuadrantItem("Flash-Reason-1.5", 25, 78)
mReasoning = QuadrantItem("DeepThink-R2", 60, 89)
mOpen = QuadrantItem("OpenReason-70B", 45, 82)
mDistilled = QuadrantItem("Distill-8B-CoT", 15, 68)
flowCard = Card([CardHeader("Inference token budget flow", "Mean token allocation from prompt to generated answer"), tokenSankey])
tokenSankey = Sankey(["Context Window", "Context Window", "Context Window", "User Query", "Retrieved Chunks", "CoT Reasoning", "CoT Reasoning"], ["System Prompt", "User Query", "Retrieved Chunks", "CoT Reasoning", "CoT Reasoning", "Draft Answer", "Final Output"], [1200, 800, 3200, 800, 3200, 2400, 1600], "tokens", "CoT Reasoning")
benchmarkCard = Card([CardHeader("Domain benchmark accuracy comparison"), benchmarkBar])
benchmarkBar = BarChart(["Coding (SWE)", "Math (AIME)", "SysDesign", "Logic Puzzles"], [Series("Frontier-Thought-v3", [89, 84, 91, 95]), Series("Flash-Reason-1.5", [78, 72, 82, 85]), Series("OpenReason-70B", [81, 76, 85, 88])], "grouped", "Domain", "Accuracy %")
reviewCard = Card([CardHeader("Peer review sign-off"), reviewForm])
reviewForm = Form("research_review", reviewButtons, [verdictControl, commentsControl])
verdictControl = FormControl("Verdict", RadioGroup("verdict", [RadioItem("Accept", "Ready for publication with no changes", "accept"), RadioItem("Minor revisions", "Add latency variance intervals", "minor"), RadioItem("Ablations needed", "Include FP16 vs INT4 quantization ablation", "ablation")]))
commentsControl = FormControl("Methodology notes", TextArea("comments", "Feedback on benchmark harness and statistical significance", 2))
reviewButtons = Buttons([Button("Submit peer review", @ToAssistant("Research review submitted"), "primary"), Button("Export dataset")])
</script>
</body>
</html>
