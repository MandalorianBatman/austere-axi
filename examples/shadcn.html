<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="description" content="Sample of the bundled shadcn pack: a session store cutover status page with progress, avatars, a calendar, a timeline and a keyboard shortcut.">
<title>Session store cutover: shadcn pack sample</title>
<script src="https://cdn.jsdelivr.net/npm/austere-axi@0/dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([title, progressCard, teamCard, scheduleCard, historyCard, rollbackCard], "column", "l")
title = MarkDownRenderer("# Session store cutover: status\n\nShadcn pack sample · Redis to Postgres · cutover on 12 Nov")
progressCard = Card([CardHeader("Backfill", "Copying live sessions into Postgres before the flag flips"), backfill, backfillNote])
backfill = Progress(64, "Rows migrated")
backfillNote = TextContent("1.2M of 1.9M rows. The job is **idempotent**, so a restart is safe.", "small")
teamCard = Card([CardHeader("Who is on it"), team, owners])
team = AvatarGroup([ada, grace, linus], 2)
ada = Avatar("Ada Lovelace")
grace = Avatar("Grace Hopper")
linus = Avatar("Linus Torvalds")
owners = TextContent("Ask in the channel before touching the **sessions_pg** flag.", "small")
scheduleCard = Card([CardHeader("Dates", "4 Nov code freeze, 12 Nov cutover"), cal])
cal = Calendar("2026-11", ["2026-11-04 Code freeze", "2026-11-12 Cutover"])
historyCard = Card([CardHeader("What got us here"), history])
history = Timeline([found, fixed, rollout])
found = TimelineItem("Failover logged out 38k users", "Oct 28", "Sessions lived only in Redis.")
fixed = TimelineItem("Dual-write merged", "Oct 29", "Postgres receives every write.", "done")
rollout = TimelineItem("Cutover", "Nov 12", "Reads switch to Postgres.", "upcoming")
rollbackCard = Card([CardHeader("If it goes wrong"), rollbackText, rollbackKeys])
rollbackText = TextContent("Turn the flag off. Reads fall back to Redis within one minute. Open the flag panel with:")
rollbackKeys = Kbd("Ctrl+Shift+P")
</script>
</body>
</html>
