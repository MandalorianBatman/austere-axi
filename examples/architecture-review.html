<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Architecture review for a multi-region event mesh: topology, radar trade-off evaluation, waterfall latency breakdown, and cutover plan.">
<title>Architecture review: multi-region event mesh</title>
<script src="../dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([title, recommend, topology, tradeoffs, latencyBreakdown, recommendations, decide], "column", "l")
title = MarkDownRenderer("# Multi-region event mesh\n\nArchitecture review · RFC-89 · global event ingestion · under review")
recommend = Callout("info", "Recommendation: approve the active-active mesh, with conditions", "It is the only option under the 120 ms p95 budget with zero data loss. Conditions: EU payloads never leave EU-West, and the cutover follows the three-phase rollout below.")
topology = Card([CardHeader("Target topology", "Goals: under 120 ms global p95, RPO = 0, EU data stays in the EU"), topoDiagram])
topoDiagram = Architecture([edgeGateway, usMesh, euMesh, apacMesh, globalStore], [eToUs, eToEu, eToApac, syncUsGlobal, syncEuGlobal, syncApacGlobal], [meshGroup, euZone])
edgeGateway = Node("Anycast Edge", "cloud", "Cloudflare Workers", null, "strong")
usMesh = Node("US-East Mesh", "backend", "Kafka 3 brokers")
euMesh = Node("EU-West Mesh", "backend", "Kafka 3 brokers")
apacMesh = Node("APAC Mesh", "backend", "Kafka 3 brokers")
globalStore = Node("Global index", "database", "Spanner, metadata only")
eToUs = Edge(edgeGateway, usMesh, "<20ms", "emphasis")
eToEu = Edge(edgeGateway, euMesh, "<25ms")
eToApac = Edge(edgeGateway, apacMesh, "<30ms")
syncUsGlobal = Edge(usMesh, globalStore, "CDC", "dashed")
syncEuGlobal = Edge(euMesh, globalStore, "keys only", "dashed", "warning")
syncApacGlobal = Edge(apacMesh, globalStore, "CDC", "dashed")
meshGroup = Group("Regional meshes", [usMesh, euMesh, apacMesh])
euZone = Group("EU residency", [euMesh], "security")
tradeoffs = Card([CardHeader("Option evaluation", "Scores 0 to 10, outer ring is best. Economy: 10 is cheapest to run."), tradeoffRadar])
tradeoffRadar = Radar(["Latency", "Durability", "Partitions", "Economy", "Simplicity"], [meshA, meshB, meshC], 10)
meshA = RadarSeries("Active-active mesh", [9, 9, 8, 5, 6], true)
meshB = RadarSeries("Dual ingest", [7, 8, 9, 7, 5])
meshC = RadarSeries("Central hub", [5, 9, 4, 9, 9])
latencyBreakdown = Card([CardHeader("Where the 120 ms goes", "The active-active mesh at p95: 15 ms of headroom"), latencyWaterfall])
latencyWaterfall = Waterfall(["Budget", "DNS & TLS", "Edge auth", "Routing", "Kafka ack", "MirrorMaker", "Headroom"], [120, -22, -14, -8, -35, -26, 15], "ms", "Kafka ack")
recommendations = Card([CardHeader("Rollout", "Each phase has a rollback trigger"), recTable])
recTable = Table([Col("Phase", ["1. Canary", "2. Dual publish", "3. Cutover"]), Col("Rollback trigger", ["Error rate > 0.1%", "Mirror lag > 500 ms", "p95 > 150 ms"]), Col("Regions", ["US-East", "US + EU", "US, EU, APAC"]), Col("Date", ["15 Jan", "1 Feb", "15 Feb"])])
decide = Card([CardHeader("Your verdict"), decideForm])
decideForm = Form("arch_review", decideButtons, [decisionField, feedbackField])
decisionField = FormControl("Verdict", RadioGroup("choice", [RadioItem("Approve", "Proceed with the mesh as proposed", "approve"), RadioItem("Approve with conditions", "Proceed once the notes below are met", "conditional"), RadioItem("Send back", "Pick another option or revise the RFC", "back")]))
feedbackField = FormControl("Architectural considerations", TextArea("notes", "Add notes or constraints for the infrastructure squad", 2))
decideButtons = Buttons([Button("Submit review", @ToAssistant("Architecture review submitted"), "primary"), Button("Request meeting", null, "secondary")])
</script>
</body>
</html>
