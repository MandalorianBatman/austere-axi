<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Backtest report for a gold futures roll rule on synthetic data: premium, equity curve, KPIs, trades and a parameter form the agent answers by patching.">
<title>Backtest report: gold futures roll</title>
<script src="../dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([headerCard, kpiCard, chartCard, paramCard, methodCard], "column", "l")
headerCard = Card([CardHeader("Backtest report: gold futures roll", "Calendar-spread roll rule · 180 trading days · synthetic data"), syntheticNote])
syntheticNote = Callout("warning", "Synthetic data", "Every number on this page is generated for the example. It is not market data and not a trading result.")
kpiCard = Card([CardHeader("Results"), kpiBlock])
kpiBlock = OverviewCardBlock([kpiPnl, kpiTrades, kpiWin, kpiDd])
kpiPnl = OverviewCardItem("pnl", Text("text", "Net P&L (synthetic units)"), MetricIndicatorInline("+75", "7-day roll window"))
kpiTrades = OverviewCardItem("trades", Text("text", "Rolls traded"), MetricIndicatorInline("5", "one per 30-day contract"))
kpiWin = OverviewCardItem("win", Text("text", "Win rate"), MetricIndicatorInline("100%", "5 of 5 rolls"))
kpiDd = OverviewCardItem("dd", Text("text", "Max drawdown"), MetricIndicatorInline("3", "peak to trough"))
chartCard = Card([CardHeader("Premium and equity curve"), chartTabs])
chartTabs = Tabs([tabPremium, tabEquity, tabTrades])
tabPremium = TabItem("premium", "Premium", [premiumChart])
tabEquity = TabItem("equity", "Equity curve", [equityChart])
tabTrades = TabItem("trades", "Trades", [tradesTable])

paramForm = Form("backtest_params", paramButtons, [rollField, pairField, costField])
rollField = FormControl("Roll window", Slider("roll_days", "discrete", 1, 15, 1, [7], "Days before expiry"), "Hold the spread this many days before the near contract expires.")
pairField = FormControl("Contract pair", Select("pair", [SelectItem("near_next", "Near vs next month"), SelectItem("near_far", "Near vs far month")], "Near vs next month"))
costField = FormControl("Cost per day", Input("cost", "1.2", "number", {numeric: true, min: 0}), "Synthetic units per day in the roll window.")
paramButtons = Buttons([Button("Run backtest", @ToAssistant("Re-run backtest with these parameters"), "primary")])
methodCard = Card([CardHeader("Methodology"), methodText])
methodText = MarkDownRenderer("**Roll rule.** The near contract expires every 30 trading days. From the day the window opens (7 days before expiry by default) the strategy holds the calendar spread and earns the daily fall in the near-to-next premium. It exits the day before expiry and waits for the next window.\n\n**Costs.** A flat cost per day is charged while the spread is held.\n\n**Data.** Premium is a synthetic series that decays toward expiry and jumps back at each roll. Nothing here is fitted to real prices.")
