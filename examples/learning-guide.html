<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Interactive learning guide to the Raft consensus protocol: node state machine, leader election sequence, and quorum replication profile.">
<title>Interactive guide: Raft consensus algorithm</title>
<script src="../dist/austere.js"></script>
</head>
<body>
<script type="text/openui">
root = Stack([title, rolesCard, electionCard, replicationCard, quizCard], "column", "l")
title = MarkDownRenderer("# How Raft elects a leader and replicates a log\n\nSystems guide · 3 min read · from the Raft paper (Ongaro and Ousterhout, 2014)")
rolesCard = Card([CardHeader("Every server is in one of three roles", "A follower waits, a candidate asks for votes, a leader serves clients"), rolesText, roleMachine, coreRule])
rolesText = MarkDownRenderer("Raft splits consensus into **leader election**, **log replication** and **safety**. A follower that hears no heartbeat before its election timeout becomes a candidate. A leader that sees a higher term steps down.")
roleMachine = StateMachine([stStart, stFollower, stCandidate, stLeader], [trBoot, trTimeout, trVoteOk, trSplit, trHigherTerm])
stStart = State("start", "initial")
stFollower = State("Follower", "state", "resets timer on heartbeat")
stCandidate = State("Candidate", "state", "term + 1, votes for self")
stLeader = State("Leader", "state", "sends heartbeats")
trBoot = Transition(stStart, stFollower)
trTimeout = Transition(stFollower, stCandidate, "election timeout", null, "start election")
trVoteOk = Transition(stCandidate, stLeader, "majority of votes", null, "become leader")
trSplit = Transition(stCandidate, stCandidate, "split vote", null, "new term, new timer")
trHigherTerm = Transition(stLeader, stFollower, "sees higher term", null, "step down")
coreRule = Callout("info", "Leader completeness", "A log entry committed in one term is present in the log of every leader of a later term.")
electionCard = Card([CardHeader("One election, message by message", "S1 times out first, so it asks S2 and S3 for votes in term 2"), electionSeq])
electionSeq = Sequence([s1, s2, s3], [msgRequestVoteA, msgVoteA, msgRequestVoteB, msgVoteB, msgHeartbeatA, msgHeartbeatB])
s1 = Actor("S1", "service")
s2 = Actor("S2", "service")
s3 = Actor("S3", "service")
msgRequestVoteA = Message(s1, s2, "RequestVote(term=2)", "call")
msgVoteA = Message(s2, s1, "VoteGranted", "return", "emphasis")
msgRequestVoteB = Message(s1, s3, "RequestVote(term=2)", "call")
msgVoteB = Message(s3, s1, "VoteGranted", "return")
msgHeartbeatA = Message(s1, s2, "AppendEntries (heartbeat)", "async")
msgHeartbeatB = Message(s1, s3, "AppendEntries (heartbeat)", "async")
replicationCard = Card([CardHeader("One write, after the election", "The leader commits once a majority has the entry. S1 and S2 are a majority of 3."), replicationSeq])
replicationSeq = Sequence([client, leader, f2, f3], [rpWrite, rpAppendA, rpAppendB, rpAckA, rpCommit, rpReply])
client = Actor("Client", "user")
leader = Actor("S1 (leader)", "service")
f2 = Actor("S2", "service")
f3 = Actor("S3", "service")
rpWrite = Message(client, leader, "set x = 5")
rpAppendA = Message(leader, f2, "AppendEntries(index 7)", "async")
rpAppendB = Message(leader, f3, "AppendEntries(index 7)", "async")
rpAckA = Message(f2, leader, "ok", "return")
rpCommit = Message(leader, leader, "commit index 7")
rpReply = Message(leader, client, "ok", "return", "emphasis")
quizCard = Card([CardHeader("Check yourself"), quizForm])
quizForm = Form("raft_quiz", quizButtons, [q1Control])
q1Control = FormControl("When can a leader mark an entry committed?", RadioGroup("q1", [RadioItem("Once a majority has stored it", "The leader counts itself", "majority"), RadioItem("Once the leader has written it", "Its own log is enough", "leader_only"), RadioItem("Once every follower has acknowledged", "Wait for all of them", "all")]))
quizButtons = Buttons([Button("Check answer", @ToAssistant("Check my answer to the Raft quiz"), "primary"), Button("Explain commit", @ToAssistant("Explain how a Raft leader commits an entry"), "secondary")])
</script>
</body>
</html>
